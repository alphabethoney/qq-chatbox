[project]
name = "qq-chatbox"
version = "1.0.0"
description = "NTQQ 聊天记录导出（JSON/TXT）+ 基于记录的聊天机器人（数字分身/历史问答）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["cryptography>=41"]

[project.scripts]
qq-exporter = "qq_exporter.cli:main"
qq-chatbot = "qq_chatbot.cli:main"

[project.optional-dependencies]
# 聊天机器人：默认 hash 向量 + mock LLM 零额外依赖即可跑通；
# 启用云端 OpenAI 兼容 / 本地 ollama 时无需额外包（走 urllib），
# 需要 YAML 配置时才装 PyYAML。
chatbot = ["PyYAML>=6"]
chatbot-http = ["fastapi>=0.100", "uvicorn>=0.23"]
# 接入 QQ（NapCat OneBot11 WebSocket）。
chatbot-qq = ["websocket-client>=1.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["qq_exporter", "qq_chatbot"]
