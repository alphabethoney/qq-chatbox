[project]
name = "qq-chat-exporter"
version = "1.0.0"
description = "从 Windows NTQQ 本地数据库中导出聊天记录（JSON / 纯 TXT）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["cryptography>=41"]

[project.scripts]
qq-exporter = "qq_exporter.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["qq_exporter"]
