[project]
name = "qq-chatbox"
version = "1.1.0"
description = "NTQQ 聊天记录导出（JSON/TXT）+ 媒体下载 + 定时增量导出"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["cryptography>=41"]

[project.scripts]
qq-exporter = "qq_exporter.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["qq_exporter"]
